<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Computer World | Home</title>
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700;800&display=swap');

        :root {
            --bg-black: #020617;
            --dark-blue: #09335a;
            --faint-blue: #00ddff;
            --white: #ffffff;
            --glass: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }

        body { background: var(--bg-black); color: var(--white); overflow-x: hidden; min-height: 100vh; }

        /* --- BACKGROUND LAYERS --- */
        .city-bg { position: fixed; inset: 0; background: url('https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&q=80') center/cover no-repeat; filter: blur(15px) brightness(0.2); z-index: -3; }
        .prism-layer { position: fixed; inset: 0; background: linear-gradient(135deg, var(--bg-black) 45%, var(--dark-blue) 45%); z-index: -2; }
        .prism-line { position: fixed; top: 0; left: 45%; width: 1px; height: 150%; background: var(--faint-blue); transform: rotate(45deg); box-shadow: 0 0 25px var(--faint-blue); opacity: 0.25; z-index: -1; }

        /* --- TACTILE CLICK ANIMATION --- */
        .clickable { transition: transform 0.1s ease; cursor: pointer; position: relative; }
        .clickable:active { transform: scale(0.95); }

        /* --- NAVIGATION (GLASS EFFECT & HOVER) --- */
        nav, .mobile-nav {
            background: rgba(0, 0, 0, 0.45) !important;
            backdrop-filter: blur(25px) saturate(160%) !important;
            -webkit-backdrop-filter: blur(25px) saturate(160%) !important;
        }

        nav { position: fixed; top: 0; width: 100%; height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 5%; z-index: 1000; border-bottom: 1px solid var(--glass-border); }
        .logo { font-weight: 800; font-size: 1.2rem; text-decoration: none; color: white; letter-spacing: 1.5px; }
        .logo span { color: var(--faint-blue); }

        /* Hover Glow & Expanding line for Desktop */
        .nav-links { display: flex; gap: 10px; }
        .nav-link {
            position: relative; color: rgba(255,255,255,0.7); text-decoration: none; 
            font-size: 0.7rem; font-weight: 600; text-transform: uppercase; 
            padding: 10px; transition: all 0.3s ease;
        }

        .nav-link::after, .m-link::after {
            content: ''; position: absolute; bottom: 0; left: 50%; width: 0; height: 2px;
            background: var(--faint-blue); box-shadow: 0 0 10px var(--faint-blue);
            transition: all 0.3s ease; transform: translateX(-50%);
        }

        .nav-link:hover, .m-link:hover {
            color: var(--faint-blue) !important;
            text-shadow: 0 0 15px rgba(0, 212, 255, 0.8);
        }
        .nav-link:hover::after, .m-link:hover::after { width: 70%; }

        /* --- MOBILE NAVIGATION (Left-to-Right Swiping on Android) --- */
        .mobile-nav {
            position: fixed; bottom: 0; width: 100%; height: 75px;
            display: flex; align-items: center;
            border-top: 1px solid var(--glass-border); z-index: 1001;
            overflow-x: auto; /* Swipe from Left to Right */
            padding: 0 15px;
            scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch;
        }
        .mobile-nav::-webkit-scrollbar { display: none; } /* Hide scrollbar */

        .m-link { 
            flex: 0 0 auto; /* Prevent icons from shrinking */
            min-width: 85px; text-decoration: none; text-align: center; 
            font-size: 0.65rem; color: rgba(255,255,255,0.4); 
            display: flex; flex-direction: column; align-items: center;
            transition: 0.3s;
        }
        .m-link i { font-size: 1.3rem; display: block; margin-bottom: 3px; }
        .m-link.active { color: var(--faint-blue); }

        /* --- MAIN CONTENT --- */
        .container { padding: 100px 5% 120px 5%; max-width: 600px; margin: 0 auto; }
        .profile-header { text-align: center; margin-top: 40px; }
        .profile-logo { width: 140px; height: 140px; margin: 0 auto 20px; display: flex; align-items: center; justify-content: center; }
        .profile-logo img { width: 100%; height: 100%; object-fit: contain; }

        .owner-name { font-weight: 400; font-size: 1.8rem; letter-spacing: 1px; }
        .owner-title { font-size: 0.9rem; font-weight: 700; color: #ccc; border-top: 2px solid #f2a68d; display: inline-block; padding-top: 5px; margin-top: 5px; text-transform: uppercase; }

        .action-buttons { display: flex; justify-content: center; gap: 10px; margin: 30px 0; }
        .action-btn { background: #007bb5; color: white; border-radius: 50px; padding: 10px 20px; text-decoration: none; font-size: 0.8rem; display: flex; align-items: center; gap: 8px; font-weight: 600; transition: 0.3s; }
        .action-btn.wa { background: #25d366; }
        .action-btn.sms { background: #0088cc; }

        .info-list { max-width: 400px; margin: 0 auto; }
        .info-item { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; font-size: 0.9rem; color: #eee; background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; border: 1px solid var(--glass-border); transition: 0.3s; }
        .info-item:hover { border-color: var(--faint-blue); }
        .info-icon { width: 40px; height: 40px; background: #007bb5; border-radius: 50%; display: flex; align-items: center; justify-content: center; flex-shrink: 0; color: white; }

        .translate-box { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 12px; max-width: 220px; margin: 20px auto; text-align: center; border: 1px solid var(--glass-border); cursor: pointer; transition: 0.3s; }

        /* Language Modal */
        #langList { display: none; grid-template-columns: 1fr 1fr; gap: 10px; padding: 15px; background: rgba(0,0,0,0.9); backdrop-filter: blur(10px); border-radius: 15px; border: 1px solid var(--faint-blue); margin: 10px auto; max-width: 320px; }
        .l-btn { background: rgba(255,255,255,0.05); color: white; border: 1px solid #333; padding: 10px; cursor: pointer; border-radius: 8px; font-size: 0.8rem; }
        .l-btn:hover { background: var(--faint-blue); color: black; font-weight: 700; }

        .bottom-actions { display: flex; gap: 10px; max-width: 400px; margin: 20px auto; }
        .btn-full { flex: 1; padding: 15px; border-radius: 12px; background: #007bb5; color: white; text-align: center; text-decoration: none; font-size: 0.85rem; font-weight: 700; border: none; cursor: pointer; }

        .social-footer { display: flex; justify-content: center; gap: 15px; margin-top: 40px; padding-bottom: 100px; }
        .social-circle { width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 1.2rem; text-decoration: none; transition: 0.3s; }
        .ig { background: #E1306C; } .fb { background: #4267B2; } .li { background: #0077b5; } .wa-footer { background: #25d366; } .sms-footer { background: #ff9800; }

        @media (max-width: 850px) { .nav-links { display: none; } }
        #google_translate_element, .goog-te-banner-frame { display: none !important; }
        body { top: 0px !important; }
    </style>
</head>

    <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <script>
        // 1. Language Toggle
        function toggleLang() { const l = document.getElementById('langList'); l.style.display = (l.style.display === 'grid') ? 'none' : 'grid'; }
        function translateTo(code) {
            const sel = document.querySelector(".goog-te-combo");
            if (sel) { sel.value = code; sel.dispatchEvent(new Event('change')); toggleLang(); }
        }

        // 2. Click Feedback
        document.addEventListener('mousedown', function (e) {
            const el = e.target.closest('.clickable');
            if (el) { el.style.transform = "scale(0.95)"; setTimeout(() => { el.style.transform = ""; }, 150); }
        });

        function downloadVCard() {
            const v = "BEGIN:VCARD\nVERSION:3.0\nFN:Pankaj Sant Computer World\nTEL:9890234503\nEND:VCARD";
            const b = new Blob([v], {type: "text/vcard"});
            const u = URL.createObjectURL(b);
            const a = document.createElement("a"); a.href = u; a.download = "Pankaj_Sant.vcf"; a.click();
        }
        function shareProfile() { if(navigator.share) navigator.share({url: window.location.href}); }
    </script>
